<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lazy Travel — Landing Page</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Tailwind Play CDN：原型階段用這支就好。
     正式進專案時改成 npm 安裝 + 建置產物（見檔案最下方註解） -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#FCFAF3',        // 頁面米白底
          ink:   '#3F4247',        // 一般文字
          brand: {
            blue:   '#1D63C4',     // Lazy
            orange: '#F5811F',     // Travel／CTA
            green:  '#7E9B3F',     // 標題下的筆刷
            pink:   '#E8365D'      // Logo
          }
        },
        fontFamily: {
          display: ['Poppins', 'Noto Sans TC', 'sans-serif'],
          body:    ['Poppins', 'Noto Sans TC', 'sans-serif'],
          script:  ['Caveat', 'cursive']
        }
      }
    }
  }
</script>

<style type="text/tailwindcss">
  /* 尊重使用者的減少動態設定 */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body class="min-h-dvh bg-cream font-body text-ink antialiased flex flex-col overflow-x-hidden">

  <!-- ══════════════════════════════════════════════════════════
       1. 導覽列
       ══════════════════════════════════════════════════════════ -->
  <header class="w-full shrink-0">
    <nav class="mx-auto flex max-w-[1400px] items-center gap-3 px-5 py-5 sm:px-8 lg:gap-10 lg:px-14">

      <!-- Logo 佔位符：之後換成 <img src="…/logo.svg" alt="Lazy Travel"> -->
      <a href="/" class="shrink-0" aria-label="Lazy Travel 首頁">
        <span class="grid h-11 w-11 place-items-center rounded-lg border-[3px] border-brand-pink font-display text-2xl font-extrabold leading-none text-brand-pink">
          Z
        </span>
      </a>

      <!-- 桌機選單 -->
      <ul class="hidden items-center gap-8 font-display text-sm font-medium tracking-widest text-ink/70 lg:flex xl:gap-12">
        <li>
          <a href="/" class="relative py-1 text-brand-blue transition hover:text-brand-blue" aria-current="page">
            HOME
            <span class="absolute inset-x-0 -bottom-1 h-[3px] rounded-full bg-brand-blue"></span>
          </a>
        </li>
        <li><a href="/about"   class="py-1 transition hover:text-brand-blue">ABOUT</a></li>
        <li><a href="/contact" class="py-1 transition hover:text-brand-blue">CONTACT</a></li>
        <!-- ↓ CMS：指向現有的後台管理系統（Areas/Admin → DashboardController.Index）
             ASP.NET 版改成 asp-area="Admin" asp-controller="Dashboard" asp-action="Index" -->
        <li><a id="nav-cms" href="/Admin" class="py-1 transition hover:text-brand-blue">CMS</a></li>
      </ul>

      <!-- 右側：搜尋 + 手機漢堡 -->
      <div class="ml-auto flex items-center gap-2">
        <button type="button" id="searchBtn"
                class="grid h-11 w-11 place-items-center rounded-full text-ink/80 transition hover:bg-black/5 hover:text-brand-blue focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-blue"
                aria-label="搜尋">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
          </svg>
        </button>

        <button type="button" id="menuBtn"
                class="grid h-11 w-11 place-items-center rounded-full text-ink/80 transition hover:bg-black/5 lg:hidden focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-blue"
                aria-label="開啟選單" aria-expanded="false" aria-controls="mobileMenu">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
      </div>
    </nav>

    <!-- 手機選單 -->
    <div id="mobileMenu" class="hidden border-y border-black/5 bg-cream px-5 pb-4 sm:px-8 lg:hidden">
      <ul class="flex flex-col font-display text-sm font-medium tracking-widest text-ink/70">
        <li><a href="/"        class="block border-b border-black/5 py-3 text-brand-blue" aria-current="page">HOME</a></li>
        <li><a href="/about"   class="block border-b border-black/5 py-3">ABOUT</a></li>
        <li><a href="/contact" class="block border-b border-black/5 py-3">CONTACT</a></li>
        <li><a href="/Admin"   class="block py-3">CMS</a></li>
      </ul>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════
       2 + 3. 主視覺：桌機左右並排，手機上下堆疊（文字在上、圖在下）
       ══════════════════════════════════════════════════════════ -->
  <main class="flex flex-1 items-center">
    <div class="mx-auto grid w-full max-w-[1400px] grid-cols-1 items-center gap-6 px-5 pb-6 pt-2 sm:px-8 lg:grid-cols-2 lg:gap-6 lg:px-14 lg:pb-4">

      <!-- ── 左：文案 ── -->
      <div class="order-1 lg:pr-6">
        <h1 class="font-display font-extrabold leading-[0.92] tracking-tight">
          <span class="block text-brand-blue text-[clamp(3.75rem,13vw,8.5rem)]">Lazy</span>
          <span class="block text-brand-orange text-[clamp(3.75rem,13vw,8.5rem)]">Travel</span>
        </h1>

        <!-- 綠色手繪筆刷 -->
        <svg class="mt-6 h-3 w-40 sm:w-52" viewBox="0 0 220 14" fill="none" aria-hidden="true">
          <path d="M4 9C48 3 104 2 158 5c22 1 42 3 58 5" stroke="#7E9B3F" stroke-width="7" stroke-linecap="round"/>
        </svg>

        <p class="mt-6 max-w-md text-base leading-relaxed text-ink/70">
          慢慢走，才看得見風景。找到步調相同的旅伴，走一段不用趕的路。
        </p>

        <!-- READ MORE：橘色膠囊 + 外框 -->
        <a href="/about"
           class="group mt-8 inline-flex items-center gap-2 rounded-full bg-brand-orange px-10 py-4
                  font-display text-base font-semibold tracking-wide text-white
                  ring-2 ring-brand-orange ring-offset-4 ring-offset-cream
                  transition hover:-translate-y-0.5 hover:bg-orange-600 hover:shadow-lg hover:shadow-brand-orange/30
                  focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-blue">
          READ MORE
          <svg class="h-5 w-5 transition group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h13M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>

      <!-- ── 右：插畫（手機時排到文字下方） ── -->
      <div class="relative order-2">
        <!-- 想換成自己的插畫，改這支 <img> 的 src 就好。
             比例用 aspect-[9/8]，圖用 object-contain 靠底對齊，換圖不會變形。 -->
        <img src="img/hero-illustration.svg"
             alt="插畫：背包客站在海岸懸崖上眺望遠方的山與海"
             width="900" height="780" loading="eager" decoding="async"
             class="mx-auto aspect-[15/13] w-full max-w-[640px] object-contain object-bottom lg:max-w-none" />

        <!-- 手寫小字 -->
        <p class="pointer-events-none absolute -bottom-1 right-2 font-script text-3xl leading-none text-brand-blue sm:text-4xl lg:right-6">
          Enjoy <span class="text-brand-orange">and</span><br />
          <span class="inline-flex items-end gap-2">
            Have Fun
            <svg class="mb-1 h-5 w-12 text-brand-orange" viewBox="0 0 60 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 10h50M44 3l8 7-8 7"/>
            </svg>
          </span>
        </p>
      </div>

    </div>
  </main>

  <!-- ══════════════════════════════════════════════════════════
       4. 底部：社群 icon + HELP
       ══════════════════════════════════════════════════════════ -->
  <footer class="w-full shrink-0">
    <div class="mx-auto flex max-w-[1400px] flex-wrap items-center gap-x-5 gap-y-3 px-5 pb-7 pt-4 sm:px-8 lg:px-14">

      <ul class="flex items-center gap-4">
        <li>
          <a href="#" aria-label="Facebook"
             class="block text-ink transition hover:text-brand-blue focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-blue">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M22 12a10 10 0 10-11.6 9.9v-7h-2.5V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.75-1.6 1.5V12h2.7l-.43 2.9h-2.27v7A10 10 0 0022 12z"/>
            </svg>
          </a>
        </li>
        <li>
          <a href="#" aria-label="Instagram"
             class="block text-ink transition hover:text-brand-blue focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-blue">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2.2c3.2 0 3.6 0 4.85.07 1.17.05 1.8.25 2.23.42.56.22.96.48 1.38.9.42.42.68.82.9 1.38.17.42.37 1.06.42 2.23.06 1.26.07 1.64.07 4.83s-.01 3.57-.07 4.83c-.05 1.17-.25 1.8-.42 2.23a3.7 3.7 0 01-.9 1.38 3.7 3.7 0 01-1.38.9c-.42.17-1.06.37-2.23.42-1.26.06-1.64.07-4.85.07s-3.58-.01-4.84-.07c-1.17-.05-1.8-.25-2.23-.42a3.7 3.7 0 01-1.38-.9 3.7 3.7 0 01-.9-1.38c-.17-.42-.37-1.06-.42-2.23C2.2 15.6 2.2 15.2 2.2 12s0-3.6.07-4.85c.05-1.17.25-1.8.42-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.17 1.06-.37 2.23-.42C8.42 2.2 8.8 2.2 12 2.2zm0 1.8c-3.14 0-3.5.01-4.74.07-1.14.05-1.76.24-2.17.4-.55.21-.94.47-1.35.88-.41.41-.67.8-.88 1.35-.16.41-.35 1.03-.4 2.17C2.4 8.5 2.4 8.86 2.4 12s.01 3.5.07 4.74c.05 1.14.24 1.76.4 2.17.21.55.47.94.88 1.35.41.41.8.67 1.35.88.41.16 1.03.35 2.17.4 1.24.06 1.6.07 4.74.07s3.5-.01 4.74-.07c1.14-.05 1.76-.24 2.17-.4.55-.21.94-.47 1.35-.88.41-.41.67-.8.88-1.35.16-.41.35-1.03.4-2.17.06-1.24.07-1.6.07-4.74s-.01-3.5-.07-4.74c-.05-1.14-.24-1.76-.4-2.17a3.6 3.6 0 00-.88-1.35 3.6 3.6 0 00-1.35-.88c-.41-.16-1.03-.35-2.17-.4C15.5 4.01 15.14 4 12 4z"/>
              <path d="M12 7.03a4.97 4.97 0 110 9.94 4.97 4.97 0 010-9.94zm0 8.2a3.23 3.23 0 100-6.46 3.23 3.23 0 000 6.46z"/>
              <circle cx="17.2" cy="6.8" r="1.16"/>
            </svg>
          </a>
        </li>
        <li>
          <a href="#" aria-label="Twitter"
             class="block text-ink transition hover:text-brand-blue focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-blue">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M22 5.9a8 8 0 01-2.36.65 4.1 4.1 0 001.8-2.27 8.2 8.2 0 01-2.6 1 4.1 4.1 0 00-7 3.74A11.65 11.65 0 013.4 4.7a4.1 4.1 0 001.27 5.47 4 4 0 01-1.85-.5v.05a4.1 4.1 0 003.29 4.02 4.1 4.1 0 01-1.85.07 4.1 4.1 0 003.83 2.85A8.24 8.24 0 012 18.4a11.62 11.62 0 006.29 1.84c7.55 0 11.68-6.25 11.68-11.67l-.01-.53A8.3 8.3 0 0022 5.9z"/>
            </svg>
          </a>
        </li>
        <li>
          <a href="#" aria-label="YouTube"
             class="block text-ink transition hover:text-brand-blue focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-blue">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21.6 7.2a2.5 2.5 0 00-1.76-1.77C18.25 5 12 5 12 5s-6.25 0-7.84.43A2.5 2.5 0 002.4 7.2 26 26 0 002 12a26 26 0 00.4 4.8 2.5 2.5 0 001.76 1.77C5.75 19 12 19 12 19s6.25 0 7.84-.43a2.5 2.5 0 001.76-1.77A26 26 0 0022 12a26 26 0 00-.4-4.8zM10 15.02V8.98L15.2 12 10 15.02z"/>
            </svg>
          </a>
        </li>
      </ul>

      <span class="h-6 w-px bg-ink/20" aria-hidden="true"></span>

      <a href="/help"
         class="inline-flex items-center gap-2 font-display text-sm font-medium tracking-widest text-ink transition hover:text-brand-blue focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-blue">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9.6 9.2a2.5 2.5 0 114.1 2.2c-.8.6-1.7 1-1.7 2.1" stroke-linecap="round"/>
          <circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/>
        </svg>
        HELP
      </a>
    </div>
  </footer>

<script>
  // 手機選單開合
  var menuBtn = document.getElementById('menuBtn');
  var mobileMenu = document.getElementById('mobileMenu');
  menuBtn.addEventListener('click', function () {
    var open = mobileMenu.classList.toggle('hidden') === false;
    menuBtn.setAttribute('aria-expanded', String(open));
    menuBtn.setAttribute('aria-label', open ? '關閉選單' : '開啟選單');
  });
</script>

<!-- ============================================================
     進專案時要做的事
     ------------------------------------------------------------
     1. Tailwind 換成正式建置（Play CDN 只適合原型）：
          npm install -D tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i wwwroot/css/tw.css -o wwwroot/css/tw.build.css --watch
        然後把上面 <script src="cdn.tailwindcss.com"> 換成建置後的 css。
        注意：專案目前用 Bootstrap 5，兩套 CSS 同時載會打架，
        前台若全面改 Tailwind，記得把前台 _Layout.cshtml 的 bootstrap 拿掉，
        後台 _AdminLayout.cshtml 維持 Bootstrap 不動。

     2. 這頁搬進 Views/Home/Index.cshtml，導覽列與 footer 可抽成
        _Layout.cshtml；CMS 連結改成 Tag Helper：
          <a asp-area="Admin" asp-controller="Dashboard" asp-action="Index">CMS</a>
        後台已有 Cookie 認證，未登入會被導去 Admin/Auth/Login，不用另外擋。

     3. 插畫換成自己的檔案：把 img/hero-illustration.svg 換掉即可，
        <img> 的 width/height 記得跟著改，避免版面跳動（CLS）。
     ============================================================ -->
</body>
</html>
