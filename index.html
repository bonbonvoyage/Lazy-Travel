<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lazy Travel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ── 背景 ── */
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', 'PingFang TC', sans-serif;
  overflow: hidden;
  /* 取圖片左右邊緣的顏色，讓空白區無縫融入 */
  background: linear-gradient(180deg,
    #bec8f0 0%,
    #cfc0ef 20%,
    #e8c4e8 50%,
    #f5cee4 75%,
    #fad8ec 100%
  );
}

/* ── 主容器（寬高由 JS 依實際圖片比例計算） ── */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  box-shadow: 0 12px 60px rgba(80,0,100,0.22);
}

/* 底圖 */
.hero-img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;   /* 容器已保持正確比例，fill 不會變形 */
  user-select: none;
  pointer-events: none;
}

/* 軌道 canvas */
#orbitCanvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* 行星（大小/位置全由 JS 算，CSS 只給動畫） */
.planet {
  position: absolute;
  pointer-events: none;
  background-image: url('hero.png');
  background-repeat: no-repeat;
}
.planet-left  { animation: bounce 2.2s ease-in-out infinite; }
.planet-right { animation: bounce 1.8s ease-in-out infinite; animation-delay: -0.9s; }
@keyframes bounce {
  0%,100% { transform: translateY(0);     }
  50%      { transform: translateY(-14px); }
}

/* 流星層 */
#meteorLayer {
  position: absolute; inset: 0;
  pointer-events: none; overflow: hidden;
}

/* ── 透明按鈕，疊在圖片按鈕上 ── */
.hero-btns {
  position: absolute;
  bottom: 9.2%;        /* 依圖片按鈕位置調整 */
  left: 0; right: 0;
  display: flex;
  gap: 3.5%;
  padding: 0 13%;
  z-index: 5;
}
.hero-btns button {
  flex: 1;
  height: 44px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 30px;
  font-size: 0;          /* 隱藏文字，只留點擊區域 */
  color: transparent;
}

/* ── 登入後：右上角徽章 ── */
#userBadge {
  display: none;
  position: absolute;
  top: 2%; right: 3%;
  background: rgba(255,255,255,0.88);
  border-radius: 20px;
  padding: 4px 12px 4px 8px;
  font-size: 13px; font-weight: 600;
  color: #b04090;
  align-items: center; gap: 6px;
  cursor: pointer; z-index: 5;
  backdrop-filter: blur(6px);
  border: 1.5px solid rgba(255,160,220,0.6);
  white-space: nowrap;
}
#userBadge .avatar { font-size: 18px; }
#userBadge .hint   { font-size: 10px; color: #aaa; font-weight: 400; }

/* ════════════════════════════════
   Modal
════════════════════════════════ */
.modal-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(80,20,80,0.45);
  backdrop-filter: blur(8px);
  z-index: 200;
  align-items: center; justify-content: center;
}
.modal-backdrop.open { display: flex; }

.modal-card {
  background: linear-gradient(160deg,#fff5fb 0%,#f0e8ff 100%);
  border-radius: 24px;
  padding: 36px 32px 28px;
  width: 340px; max-width: 94vw;
  box-shadow: 0 20px 60px rgba(140,40,140,0.28);
  position: relative;
  animation: pop .28s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }

.modal-close {
  position: absolute; top: 14px; right: 16px;
  background: none; border: none;
  font-size: 22px; cursor: pointer; color: #c080b0;
}
.modal-close:hover { color: #804060; }

.modal-logo     { text-align:center; font-size:36px; margin-bottom:6px; }
.modal-title    { text-align:center; font-size:22px; font-weight:800; color:#7030a0; margin-bottom:4px; }
.modal-subtitle { text-align:center; font-size:12px; color:#b080c0; margin-bottom:20px; }

.tab-row {
  display:flex; border-radius:12px;
  background:rgba(200,160,220,.18);
  padding:3px; margin-bottom:20px;
}
.tab-btn {
  flex:1; padding:8px; border:none; background:none;
  border-radius:10px; font-size:14px; font-weight:600;
  cursor:pointer; color:#a060b0; transition:all .2s;
}
.tab-btn.active { background:white; color:#7030a0; box-shadow:0 2px 10px rgba(160,80,180,.18); }

.form-group          { margin-bottom:14px; }
.form-group label    { display:block; font-size:12px; font-weight:600; color:#9060a0; margin-bottom:5px; }
.form-group input    {
  width:100%; padding:11px 14px;
  border:1.8px solid #e0c0f0; border-radius:12px;
  font-size:14px; color:#4a1a6a; background:white;
  outline:none; transition:border-color .2s,box-shadow .2s;
}
.form-group input:focus { border-color:#c060e0; box-shadow:0 0 0 3px rgba(192,96,224,.15); }
.form-group input.err   { border-color:#f06090; }

.ferr { font-size:11px; color:#e04070; margin-top:4px; display:none; }
.ferr.show { display:block; }

.alert {
  background:#fde8f0; border:1.5px solid #f0a0c0;
  border-radius:10px; padding:9px 12px;
  font-size:13px; color:#c03060;
  margin-bottom:14px; display:none;
}
.alert.ok  { background:#e8f8f0; border-color:#80d0b0; color:#206040; }
.alert.on  { display:block; }

.btn-primary {
  width:100%; padding:13px; border:none;
  background:linear-gradient(135deg,#e060c0,#9030d0);
  border-radius:14px; color:white;
  font-size:16px; font-weight:700; cursor:pointer;
  letter-spacing:.5px; margin-top:4px;
  transition:opacity .2s,transform .15s; position:relative;
}
.btn-primary:hover  { opacity:.9; }
.btn-primary:active { transform:scale(.97); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; }

.spinner {
  display:none; width:16px; height:16px;
  border:2.5px solid rgba(255,255,255,.4);
  border-top-color:white; border-radius:50%;
  animation:spin .7s linear infinite;
  position:absolute; right:18px; top:50%;
  transform:translateY(-50%);
}
@keyframes spin { to{transform:translateY(-50%) rotate(360deg)} }

.forgot { text-align:right; margin-top:5px; }
.forgot a { font-size:12px; color:#b060d0; cursor:pointer; }
.forgot a:hover { text-decoration:underline; }

.divider {
  display:flex; align-items:center; gap:10px;
  margin:18px 0 14px; color:#c0a0d0; font-size:12px;
}
.divider::before,.divider::after { content:''; flex:1; height:1px; background:rgba(192,160,220,.4); }

.social-row { display:flex; gap:10px; }
.btn-social {
  flex:1; padding:10px 8px;
  border:1.8px solid #e0c0f0; border-radius:12px;
  background:white; font-size:13px; font-weight:600; color:#604080;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  transition:background .2s,border-color .2s;
}
.btn-social:hover { background:#f8f0ff; border-color:#c080e0; }

.modal-footer { text-align:center; margin-top:16px; font-size:12px; color:#b090c0; }
.modal-footer a { color:#9040c0; cursor:pointer; font-weight:600; }
.modal-footer a:hover { text-decoration:underline; }

.strength-bar { display:flex; gap:4px; margin-top:6px; }
.strength-bar span { flex:1; height:4px; border-radius:2px; background:#e0d0f0; transition:background .3s; }
.strength-label { font-size:11px; color:#a080b0; margin-top:3px; }
</style>
</head>
<body>

<!-- 主畫面 -->
<div class="hero">
  <img class="hero-img" id="heroImg" src="hero.png" alt="Lazy Travel">
  <canvas id="orbitCanvas"></canvas>
  <div class="planet planet-left"  id="planetL"></div>
  <div class="planet planet-right" id="planetR"></div>
  <div id="meteorLayer"></div>

  <!-- 透明按鈕疊在圖片的登入/註冊按鈕上 -->
  <div class="hero-btns">
    <button onclick="openModal('login')">登入</button>
    <button onclick="openModal('register')">註冊</button>
  </div>

  <!-- 登入後徽章 -->
  <div id="userBadge" onclick="logout()">
    <span class="avatar">🐷</span>
    <span id="badgeName"></span>
    <span class="hint">點我登出</span>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="authModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-logo">🐷</div>
    <div class="modal-title">Lazy Travel</div>
    <div class="modal-subtitle">世界連結・旅遊無限</div>

    <div class="tab-row">
      <button class="tab-btn active" id="tabL" onclick="switchTab('login')">登入</button>
      <button class="tab-btn"        id="tabR" onclick="switchTab('register')">註冊</button>
    </div>

    <div class="alert" id="alertBox"></div>

    <!-- 登入表單 -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>電子信箱</label>
        <input type="email" id="lEmail" placeholder="your@email.com" autocomplete="email">
        <div class="ferr" id="lEmailErr">請輸入正確的 Email</div>
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="lPwd" placeholder="••••••••" autocomplete="current-password">
        <div class="ferr" id="lPwdErr">請輸入密碼</div>
      </div>
      <div class="forgot"><a onclick="showForgot()">忘記密碼？</a></div>
      <button class="btn-primary" id="loginBtn" type="submit">
        登入 <div class="spinner" id="lSpin"></div>
      </button>
    </form>

    <!-- 註冊表單 -->
    <form id="registerForm" onsubmit="handleRegister(event)" style="display:none">
      <div class="form-group">
        <label>暱稱</label>
        <input type="text" id="rName" placeholder="旅行者暱稱">
        <div class="ferr" id="rNameErr">請輸入暱稱（2–16 字）</div>
      </div>
      <div class="form-group">
        <label>電子信箱</label>
        <input type="email" id="rEmail" placeholder="your@email.com" autocomplete="email">
        <div class="ferr" id="rEmailErr">請輸入正確的 Email</div>
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="rPwd" placeholder="至少 8 個字元"
               autocomplete="new-password" oninput="checkStrength(this.value)">
        <div class="strength-bar">
          <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
        </div>
        <div class="strength-label" id="sLabel"></div>
        <div class="ferr" id="rPwdErr">密碼至少 8 個字元</div>
      </div>
      <div class="form-group">
        <label>確認密碼</label>
        <input type="password" id="rPwd2" placeholder="再輸入一次" autocomplete="new-password">
        <div class="ferr" id="rPwd2Err">兩次密碼不一致</div>
      </div>
      <button class="btn-primary" id="registerBtn" type="submit">
        建立帳號 <div class="spinner" id="rSpin"></div>
      </button>
    </form>

    <div class="divider">或使用</div>
    <div class="social-row">
      <button class="btn-social" onclick="socialLogin('google')">
        <svg width="16" height="16" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.2 3.22l6.86-6.86C35.9 2.38 30.28 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.2C12.43 13.48 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.2C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google
      </button>
      <button class="btn-social" onclick="socialLogin('facebook')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2">
          <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073c0 6.03 4.388 11.027 10.125 11.927v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.313 0 2.686.235 2.686.235v2.97h-1.513c-1.491 0-1.956.93-1.956 1.874v2.25h3.328l-.532 3.49h-2.796v8.437C19.612 23.1 24 18.103 24 12.073z"/>
        </svg>
        Facebook
      </button>
    </div>

    <div class="modal-footer" id="mFooter">
      還沒有帳號？<a onclick="switchTab('register')">立即免費加入</a>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════
   AUTH
════════════════════════════ */
function openModal(tab) { switchTab(tab); clearAlert(); document.getElementById('authModal').classList.add('open'); }
function closeModal()    { document.getElementById('authModal').classList.remove('open'); }
document.getElementById('authModal').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });

function switchTab(t) {
  const login = t === 'login';
  document.getElementById('loginForm').style.display    = login ? '' : 'none';
  document.getElementById('registerForm').style.display = login ? 'none' : '';
  document.getElementById('tabL').classList.toggle('active', login);
  document.getElementById('tabR').classList.toggle('active', !login);
  document.getElementById('mFooter').innerHTML = login
    ? '還沒有帳號？<a onclick="switchTab(\'register\')">立即免費加入</a>'
    : '已有帳號？<a onclick="switchTab(\'login\')">直接登入</a>';
  clearAlert();
}

function showAlert(msg, ok) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.className = 'alert on' + (ok ? ' ok' : '');
}
function clearAlert() {
  document.getElementById('alertBox').className = 'alert';
  document.querySelectorAll('.ferr').forEach(e => e.classList.remove('show'));
  document.querySelectorAll('.form-group input').forEach(e => e.classList.remove('err'));
}
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
function fieldErr(id, errId) {
  document.getElementById(id).classList.add('err');
  document.getElementById(errId).classList.add('show');
  return false;
}

function checkStrength(pwd) {
  let s = 0;
  if (pwd.length>=8) s++;
  if (/[A-Z]/.test(pwd)) s++;
  if (/[0-9]/.test(pwd)) s++;
  if (/[^A-Za-z0-9]/.test(pwd)) s++;
  const c = ['#f06080','#f0a040','#a0d040','#40c080'];
  [1,2,3,4].forEach(i => { document.getElementById('s'+i).style.background = i<=s ? c[s-1] : '#e0d0f0'; });
  document.getElementById('sLabel').textContent = pwd ? ['','弱','中','強','非常強'][s] : '';
}

function setLoading(form, on) {
  const b = form==='login' ? 'loginBtn' : 'registerBtn';
  const s = form==='login' ? 'lSpin'    : 'rSpin';
  document.getElementById(b).disabled = on;
  document.getElementById(s).style.display = on ? 'block' : 'none';
}

async function handleLogin(e) {
  e.preventDefault(); clearAlert();
  const email = document.getElementById('lEmail').value.trim();
  const pwd   = document.getElementById('lPwd').value;
  let ok = true;
  if (!validEmail(email)) ok = fieldErr('lEmail','lEmailErr');
  if (!pwd)               ok = fieldErr('lPwd','lPwdErr') && ok;
  if (!ok) return;
  setLoading('login', true);
  try   { onLoginSuccess(await doLogin(email, pwd)); }
  catch (err) { showAlert(err.message || '登入失敗'); }
  finally     { setLoading('login', false); }
}

async function handleRegister(e) {
  e.preventDefault(); clearAlert();
  const name  = document.getElementById('rName').value.trim();
  const email = document.getElementById('rEmail').value.trim();
  const pwd   = document.getElementById('rPwd').value;
  const pwd2  = document.getElementById('rPwd2').value;
  let ok = true;
  if (!name||name.length<2||name.length>16) ok = fieldErr('rName','rNameErr');
  if (!validEmail(email))  ok = fieldErr('rEmail','rEmailErr') && ok;
  if (pwd.length < 8)      ok = fieldErr('rPwd','rPwdErr')    && ok;
  if (pwd !== pwd2)        ok = fieldErr('rPwd2','rPwd2Err')  && ok;
  if (!ok) return;
  setLoading('register', true);
  try {
    const user = await doRegister(name, email, pwd);
    showAlert(`歡迎，${user.name}！請登入 ✨`, true);
    setTimeout(() => switchTab('login'), 1600);
  } catch (err) { showAlert(err.message || '註冊失敗'); }
  finally       { setLoading('register', false); }
}

function socialLogin(p) { showAlert(`${p==='google'?'Google':'Facebook'} 登入串接中，敬請期待 🚀`); }
function showForgot()   { showAlert('重設信已寄出，請查收信箱 📬', true); }

/* ── localStorage 模擬（之後換成 fetch API） ── */
async function doLogin(email, pwd) {
  await wait(800);
  const u = getUsers().find(u => u.email===email);
  if (!u)              throw new Error('找不到此帳號，請先註冊');
  if (u.pwd!==h(pwd))  throw new Error('密碼錯誤，請再試一次');
  return u;
}
async function doRegister(name, email, pwd) {
  await wait(800);
  if (getUsers().find(u=>u.email===email)) throw new Error('此 Email 已被使用');
  const u = { name, email, pwd: h(pwd) };
  const all = getUsers(); all.push(u);
  localStorage.setItem('lt_users', JSON.stringify(all));
  return u;
}
function getUsers() { return JSON.parse(localStorage.getItem('lt_users')||'[]'); }
function h(s) { let v=0; for(let i=0;i<s.length;i++) v=(Math.imul(31,v)+s.charCodeAt(i))|0; return v.toString(16); }
function wait(ms) { return new Promise(r=>setTimeout(r,ms)); }

function onLoginSuccess(user) {
  localStorage.setItem('lt_session', JSON.stringify({name:user.name,email:user.email}));
  closeModal();
  const b = document.getElementById('userBadge');
  document.getElementById('badgeName').textContent = user.name;
  b.style.display = 'flex';
}
function logout() {
  if (!confirm('確定要登出？')) return;
  localStorage.removeItem('lt_session');
  document.getElementById('userBadge').style.display = 'none';
}
(function() {
  const s = localStorage.getItem('lt_session');
  if (s) { const {name} = JSON.parse(s); document.getElementById('badgeName').textContent=name; document.getElementById('userBadge').style.display='flex'; }
})();

/* ════════════════════════════
   動畫初始化（等圖片載入後執行）
════════════════════════════ */
const heroImg  = document.getElementById('heroImg');
const heroDiv  = document.querySelector('.hero');

/* 依圖片原始比例撐滿螢幕（不裁切、不拉伸） */
function sizeHero() {
  const ratio = heroImg.naturalWidth / heroImg.naturalHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let W, H;
  if (vh * ratio <= vw) {
    /* 高度撐滿 */
    H = vh; W = vh * ratio;
  } else {
    /* 寬度撐滿 */
    W = vw; H = vw / ratio;
  }
  heroDiv.style.width  = W + 'px';
  heroDiv.style.height = H + 'px';
  return { W: Math.round(W), H: Math.round(H) };
}

function initAll() {
  const { W, H } = sizeHero();
  setupPlanets(W, H);
  startOrbit(W, H);
  startMeteors(W, H);
}

if (heroImg.complete && heroImg.naturalWidth) initAll();
else heroImg.addEventListener('load', initAll);

/* ── 行星（全部由 JS 計算，以 430×540 為基準縮放） ── */
function setupPlanets(W, H) {
  /* [left, top, width, height] in 430×540 coords */
  const defs = {
    planetL: [28,  318, 50, 50],
    planetR: [344, 284, 62, 54]
  };
  for (const [id, [x,y,w,h]] of Object.entries(defs)) {
    const el = document.getElementById(id);
    const sx = x/430*W, sy = y/540*H;
    const sw = w/430*W, sh = h/540*H;
    Object.assign(el.style, {
      left:               sx + 'px',
      top:                sy + 'px',
      width:              sw + 'px',
      height:             sh + 'px',
      backgroundSize:     W + 'px ' + H + 'px',
      backgroundPosition: `-${sx}px -${sy}px`
    });
  }
}

/* ── 軌道箭頭 ── */
function startOrbit(W, H) {
  const canvas = document.getElementById('orbitCanvas');
  const ctx    = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;

  /* 軌道參數（430×540 基準） */
  const TILT   = -17 * Math.PI / 180;
  const PERIOD = 6000;
  const SPAN   = Math.PI * 0.82;
  /* 地球中心、軌道半軸（比例值） */
  const ECX = 0.500, ECY = 0.355;
  const ERX = 0.430, ERY = 0.105;
  let t0 = null;

  function pt(cx,cy,rx,ry,t) {
    const x=rx*Math.cos(t), y=ry*Math.sin(t);
    return { x: cx+x*Math.cos(TILT)-y*Math.sin(TILT),
             y: cy+x*Math.sin(TILT)+y*Math.cos(TILT) };
  }
  function tan(rx,ry,t) {
    const dx=-rx*Math.sin(t), dy=ry*Math.cos(t);
    return Math.atan2(dx*Math.sin(TILT)+dy*Math.cos(TILT),
                      dx*Math.cos(TILT)-dy*Math.sin(TILT));
  }
  function arrow(cx,cy,rx,ry,headT,color,glow) {
    const N=55;
    for(let i=0;i<N;i++){
      const p0=pt(cx,cy,rx,ry,headT-SPAN*(i+1)/N);
      const p1=pt(cx,cy,rx,ry,headT-SPAN*i/N);
      const a =Math.pow((N-i)/N,1.8);
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y);
      ctx.strokeStyle=color; ctx.globalAlpha=a*.9;
      ctx.lineWidth=2.5+a*3; ctx.lineCap='round';
      ctx.shadowBlur=a*18; ctx.shadowColor=glow; ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    const h=pt(cx,cy,rx,ry,headT), ang=tan(rx,ry,headT), AS=Math.max(10,W*0.03);
    ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(ang);
    ctx.shadowBlur=22; ctx.shadowColor=glow; ctx.fillStyle=color;
    ctx.beginPath(); ctx.moveTo(AS,0); ctx.lineTo(-AS*.6,-AS*.52);
    ctx.lineTo(-AS*.28,0); ctx.lineTo(-AS*.6,AS*.52);
    ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; ctx.restore();
  }

  function frame(ts) {
    if (!t0) t0=ts;
    const headT = ((ts-t0)%PERIOD)/PERIOD*Math.PI*2;
    const cx=W*ECX, cy=H*ECY, rx=W*ERX, ry=H*ERY;
    ctx.clearRect(0,0,W,H);
    /* 淡軌道環 */
    ctx.beginPath();
    for(let i=0;i<=80;i++){const p=pt(cx,cy,rx,ry,i/80*Math.PI*2);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}
    ctx.closePath(); ctx.strokeStyle='rgba(255,255,255,0.13)'; ctx.lineWidth=1.5; ctx.stroke();
    arrow(cx,cy,rx,ry,headT,          '#7af09a','#3de066');
    arrow(cx,cy,rx,ry,headT+Math.PI,  '#ffadd8','#ff66bb');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ── 流星 ── */
function startMeteors(W, H) {
  const layer = document.getElementById('meteorLayer');
  function spawn() {
    const el  = document.createElement('div');
    const sx  = Math.random()*W*.85+W*.05;
    const sy  = Math.random()*H*.42;
    const len = Math.random()*55+35;
    const sz  = Math.random()*1.5+1.2;
    const dur = (Math.random()*400+350);
    const dist= Math.random()*160+120;
    const rad = (Math.random()*14+38)*Math.PI/180;
    const dx  = dist*Math.cos(rad), dy=dist*Math.sin(rad);

    el.style.cssText=`position:absolute;left:${sx}px;top:${sy}px;width:${sz*2}px;height:${sz*2}px;border-radius:50%;background:white;box-shadow:0 0 ${sz*5}px ${sz*2}px rgba(255,255,220,.9);`;
    const tail=document.createElement('div');
    tail.style.cssText=`position:absolute;top:50%;left:0;width:${len}px;height:${sz*.8}px;margin-top:-${sz*.4}px;transform:translateX(-${len}px);background:linear-gradient(to left,rgba(255,255,255,.85),transparent);border-radius:2px;`;
    el.appendChild(tail); layer.appendChild(el);

    let s=null;
    function anim(ts){
      if(!s)s=ts;
      const p=Math.min((ts-s)/dur,1);
      el.style.transform=`translate(${dx*p}px,${dy*p}px)`;
      el.style.opacity  = p<.75 ? 1 : 1-(p-.75)/.25;
      if(p<1) requestAnimationFrame(anim);
      else { el.remove(); setTimeout(spawn, Math.random()*1800+400); }
    }
    requestAnimationFrame(anim);
  }
  for(let i=0;i<3;i++) setTimeout(spawn, Math.random()*1500);
}
