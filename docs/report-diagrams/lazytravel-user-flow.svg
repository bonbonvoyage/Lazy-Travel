<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title{font:700 42px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#1f342b}.subtitle{font:500 20px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#587166}.lane{fill:#f6fbf8;stroke:#d6e8df;stroke-width:3}.lane-title{font:700 24px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#2f5f4a}.node{fill:#fff;stroke:#bad4c8;stroke-width:3}.decision{fill:#fff8f3;stroke:#e5ae95;stroke-width:3}.action{fill:#edf8f3;stroke:#7eae9a;stroke-width:4}.text{font:700 20px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#213c32}.note{font:500 15px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#667870}.line{stroke:#86aa9a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#b8cfc5;stroke-width:3;stroke-dasharray:8 8;stroke-linecap:round}.danger{fill:#fff4f1;stroke:#d98777;stroke-width:3}.danger-text{font:700 20px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#b94c43}.small{font:600 14px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#537064}
