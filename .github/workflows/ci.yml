name: CI

on:
  push:
  pull_request:
    branches: [main, feature_TourGroups_怡茜]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  dotnet:
    name: Restore, build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LazyTravel.sln

      - name: Build
        run: dotnet build LazyTravel.sln --configuration Release --no-restore

      - name: Run tests when test projects are present
        run: dotnet test LazyTravel.sln --configuration Release --no-build --verbosity normal

      - name: Publish tours-api
        run: dotnet publish tours-api/tours-api.csproj --configuration Release --no-build --output "${{ runner.temp }}/publish/tours-api"

      - name: Publish admin-api
        run: dotnet publish admin-api/admin-api.csproj --configuration Release --no-build --output "${{ runner.temp }}/publish/admin-api"

      - name: Smoke-test published applications
        shell: bash
        run: |
          ASPNETCORE_ENVIRONMENT=Production dotnet "${{ runner.temp }}/publish/tours-api/tours-api.dll" --urls http://127.0.0.1:18080 > "${{ runner.temp }}/tours-api.log" 2>&1 &
          tours_pid=$!
          ASPNETCORE_ENVIRONMENT=Production dotnet "${{ runner.temp }}/publish/admin-api/admin-api.dll" --urls http://127.0.0.1:18081 > "${{ runner.temp }}/admin-api.log" 2>&1 &
          admin_pid=$!
          trap 'kill "$tours_pid" "$admin_pid" 2>/dev/null || true' EXIT

          curl --fail --show-error --silent --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:18080/health/live
          curl --fail --show-error --silent --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:18081/health/live

  containers:
    name: Build ${{ matrix.service }} container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: tours-api
            dockerfile: Dockerfile
          - service: admin-api
            dockerfile: admin-api/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: lazytravel/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  container-smoke:
    name: Run Docker container health checks
    needs: containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build runtime images
        run: |
          docker build --tag lazytravel/tours-api:smoke --file Dockerfile .
          docker build --tag lazytravel/admin-api:smoke --file admin-api/Dockerfile .

      - name: Start application containers
        run: |
          docker run --detach --name tours-api --publish 18080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env 'ConnectionStrings__DefaultConnection=Server=unused;Database=LazyTravelDB;User Id=sa;Password=NotUsed-For-Health-Check1!;Encrypt=false;TrustServerCertificate=true' \
            lazytravel/tours-api:smoke
          docker run --detach --name admin-api --publish 18081:8080 \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env 'ConnectionStrings__DefaultConnection=Server=unused;Database=LazyTravelDB;User Id=sa;Password=NotUsed-For-Health-Check1!;Encrypt=false;TrustServerCertificate=true' \
            lazytravel/admin-api:smoke

      - name: Verify container health endpoints
        shell: bash
        run: |
          trap 'docker logs tours-api; docker logs admin-api; docker rm --force tours-api admin-api || true' EXIT
          curl --fail --show-error --silent --retry 12 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:18080/health/live
          curl --fail --show-error --silent --retry 12 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:18081/health/live
